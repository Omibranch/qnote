name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (AppImage + deb + binary)
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles appimage,deb

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: qnote-linux-x86_64
          path: src-tauri/target/release/qnote

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: qnote-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qnote-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (NSIS installer + portable)
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: qnote-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: qnote-windows-portable
          path: src-tauri/target/release/qnote.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qnote-linux-x86_64
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: qnote-linux-appimage
          path: artifacts/appimage

      - uses: actions/download-artifact@v4
        with:
          name: qnote-linux-deb
          path: artifacts/deb

      - uses: actions/download-artifact@v4
        with:
          name: qnote-windows-setup
          path: artifacts/windows-setup

      - uses: actions/download-artifact@v4
        with:
          name: qnote-windows-portable
          path: artifacts/windows-portable

      - name: Rename Linux binary
        run: |
          chmod +x artifacts/linux/qnote
          mv artifacts/linux/qnote artifacts/linux/qnote-linux-x86_64
          chmod +x artifacts/windows-portable/qnote.exe
          mv artifacts/windows-portable/qnote.exe artifacts/windows-portable/qnote-windows-portable.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/qnote-linux-x86_64
            artifacts/appimage/*.AppImage
            artifacts/deb/*.deb
            artifacts/windows-setup/*.exe
            artifacts/windows-portable/qnote-windows-portable.exe
          generate_release_notes: true
